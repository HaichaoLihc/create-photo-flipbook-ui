interface:
  display_name: "Photobook Art Direction"
  short_description: "Create artbooks with rhythm and generated spreads"
  default_prompt: "Use $create-photo-flipbook-ui to curate my photos into an artist book with varied visual rhythm and casual handwritten text, generate every spread with ImageGen, and present it in the built-in 2D book UI."
dependencies:
  tools:
    - type: "mcp"
      value: "photo-search"
      description: "Local semantic photo search with ranked contact sheets and larger previews. New folders use the bundled collection adapter with the same installed engine."
