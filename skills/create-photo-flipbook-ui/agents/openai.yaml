interface:
  display_name: "Photobook Art Direction"
  short_description: "Create photo zines with inventive editorial design"
  default_prompt: "Use $create-photo-flipbook-ui to explore distinct concepts and turn my photos into an editorial zine with recognizable photography, selective artistic transformation, purposeful page composition, consistent typography, and rhythm; generate every spread with ImageGen and present it in the built-in 2D book UI."
dependencies:
  tools:
    - type: "mcp"
      value: "photo-search"
      description: "Local semantic photo search with ranked contact sheets and larger previews. New folders use the bundled collection adapter with the same installed engine."
