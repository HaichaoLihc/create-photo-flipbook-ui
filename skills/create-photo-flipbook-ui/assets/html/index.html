<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Book title</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="room">
  <header class="book-header">
    <span>Photographs</span><h1>Book title</h1><span id="orientation">Open spread</span>
  </header>
  <section class="stage" aria-label="Interactive photo book">
    <div class="book-rig">
      <div id="book" class="book" data-page-width="512" data-page-height="640">
        <!-- Supply one complete ImageGen artwork per spread, then split it into PNG leaves.
             See references/book-editing.md. These empty leaves are scaffolding, not a finished book. -->
        <article class="book-page generated-page recto" data-density="hard" data-spread-id="cover" data-half="right" aria-label="Front cover">
          <!-- Insert: <img class="generated-artwork" src="assets/pages/cover-right.png" alt="Book title and cover artwork"> -->
        </article>
        <article class="book-page generated-page verso" data-spread-id="spread-01" data-half="left" aria-label="Page 1">
          <!-- Insert: <img class="generated-artwork" src="assets/pages/spread-01-left.png" alt="Describe the left page"> -->
        </article>
        <article class="book-page generated-page recto" data-spread-id="spread-01" data-half="right" aria-label="Page 2">
          <!-- Insert: <img class="generated-artwork" src="assets/pages/spread-01-right.png" alt="Describe the right page"> -->
        </article>
        <article class="book-page generated-page verso" data-density="hard" data-spread-id="cover" data-half="left" aria-label="Back cover">
          <!-- Insert: <img class="generated-artwork" src="assets/pages/cover-left.png" alt="Back cover artwork and credits"> -->
        </article>
      </div>
    </div>
  </section>
  <footer class="controls" aria-label="Book controls">
    <button id="previous" type="button" aria-label="Previous page">←</button>
    <div class="status" aria-live="polite"><span id="page-status">Cover</span><small>Drag or use arrow keys</small></div>
    <button id="next" type="button" aria-label="Next page">→</button>
  </footer>
</main>
<script src="vendor/page-flip.browser.js"></script>
<script src="flipbook.js"></script>
</body>
</html>
