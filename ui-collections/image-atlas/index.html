<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fafcfb">
<meta name="description" content="可复用的三维照片年轮示例，使用本地占位图与虚构日期。">
<title>生命的年轮 · Placeholder Example</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke='%236b7975' stroke-width='1.5'%3E%3Cellipse cx='16' cy='16' rx='14' ry='12'/%3E%3Cellipse cx='16' cy='16' rx='10' ry='8'/%3E%3Cellipse cx='16' cy='16' rx='5' ry='4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="space" aria-label="生命的年轮，拖拽探索照片，滚动穿越时间"><div id="world"></div></main>
<div class="horizon" aria-hidden="true"></div>
<header class="masthead"><button id="home" aria-label="返回全部年轮"><svg viewBox="0 0 40 40" width="35" height="35" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width=".9"><ellipse cx="20" cy="20" rx="17" ry="15"/><ellipse cx="20" cy="20" rx="12" ry="10"/><ellipse cx="20" cy="20" rx="6" ry="5"/></g></svg><span>生命的年轮<small>PLACEHOLDER EDITION</small></span></button><p id="archive-count"></p></header>
<div class="search-shell"><form id="search-form" role="search" autocomplete="off"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.3"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.3"/></svg><input id="search" type="search" placeholder="寻找一段日常…" aria-label="搜索照片，可输入年份、房间、吃饭、背影" aria-controls="suggestions" aria-expanded="false" spellcheck="false"><button type="button" id="clear" aria-label="清空搜索" hidden>×</button><button type="submit" class="enter" aria-label="搜索">↵</button></form><div id="suggestions" hidden></div></div>
<div class="time-note" id="time-note"><span id="period">ALL THE DAYS</span><p id="period-caption">日子，一圈一圈。</p></div>
<div class="selection" id="selection" hidden><p id="selection-meta"></p><h1 id="selection-title"></h1><div class="photo-controls"><button id="previous" aria-label="上一张照片">←</button><button id="back">回到年轮 <kbd>esc</kbd></button><button id="next" aria-label="下一张照片">→</button></div></div>
<footer class="footer"><nav id="timeline" aria-label="按年份浏览照片"></nav><p class="instructions">拖拽探索 <span>·</span> 滚动穿行 <span>·</span> 点击看大图</p></footer>
<p class="sr-only" id="announcer" role="status" aria-live="polite"></p>
<noscript><p class="no-script">请启用 JavaScript 浏览照片年轮。</p></noscript>
<script type="module" src="app.js"></script>
</body></html>
