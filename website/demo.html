<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Explore the Death Valley photo flipbook: an interactive 3D photobook with page-turning animations. A demo from Create Photo Flipbook UI." />
    <link rel="canonical" href="https://haichaolihc.github.io/create-photo-flipbook-ui/demo.html" />
    <link rel="alternate" hreflang="en" href="https://haichaolihc.github.io/create-photo-flipbook-ui/demo.html" />
    <link rel="alternate" hreflang="zh-Hans" href="https://haichaolihc.github.io/create-photo-flipbook-ui/zh/demo.html" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Photo Flipbook Demo — Death Valley | Create Photo Flipbook UI</title>
  </head>
  <body>
    <main class="app-shell">
      <canvas id="book-scene" aria-label="Interactive three-dimensional photo book"></canvas>
      <noscript><p>Enable JavaScript to turn the pages, or <a href="./">learn how to create a photo flipbook</a>.</p></noscript>
      <nav class="library" aria-label="Select a photo book" id="library"></nav>
      <div class="reader-controls" aria-label="Page controls">
        <button class="page-button" id="previous-page" type="button" aria-label="Previous page">
          <span aria-hidden="true">‹</span>
        </button>
        <button class="page-button" id="next-page" type="button" aria-label="Next page">
          <span aria-hidden="true">›</span>
        </button>
        <span class="sr-only" id="page-state" aria-live="polite">Cover</span>
      </div>
      <div class="loading-card" id="loading-card" role="status" aria-live="polite" aria-hidden="true" hidden>
        <span class="loading-pulse"></span>
        <span class="sr-only" id="loading-copy">Preparing edition</span>
      </div>
    </main>
    <script type="module" src="/src/demo.js"></script>
  </body>
</html>
